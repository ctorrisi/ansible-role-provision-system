---
# Which openSUSE rolling distribution to track: "tumbleweed" or "slowroll".
#
# Slowroll is the default: it is a slower-moving rebuild of Tumbleweed with big
# updates roughly monthly and continuous bug/security fixes in between, which
# suits a golden image better than Tumbleweed's daily churn.
opensuse_distribution: slowroll

# Repository sets per distribution. Selected by `opensuse_distribution`; to use
# a mirror or add repos, override `opensuse_repos` directly instead of editing
# these presets.
opensuse_repo_definitions:
  tumbleweed:
    - name: "repo-oss"
      description: "openSUSE-Tumbleweed-Oss"
      url: "https://download.opensuse.org/tumbleweed/repo/oss/"
      priority: 99
    - name: "repo-non-oss"
      description: "openSUSE-Tumbleweed-Non-Oss"
      url: "https://download.opensuse.org/tumbleweed/repo/non-oss/"
      priority: 99
    - name: "repo-update"
      description: "openSUSE-Tumbleweed-Update"
      url: "https://download.opensuse.org/update/tumbleweed/"
      priority: 99
  slowroll:
    - name: "repo-oss"
      description: "openSUSE-Slowroll-Oss"
      url: "https://download.opensuse.org/slowroll/repo/oss/"
      priority: 99
    - name: "repo-non-oss"
      description: "openSUSE-Slowroll-Non-Oss"
      url: "https://download.opensuse.org/slowroll/repo/non-oss/"
      priority: 99
    - name: "repo-update"
      description: "openSUSE-Slowroll-Update"
      url: "https://download.opensuse.org/update/slowroll/"
      priority: 99

# Effective repository list. Override to bypass the presets entirely.
opensuse_repos: "{{ opensuse_repo_definitions[opensuse_distribution] }}"

cpu_architecture_mappings:
  x86_64: amd64
  aarch64: arm64
