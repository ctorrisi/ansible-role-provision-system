---
- name: Install dynamic configuration scripts
  copy:
    src: "../files/bin/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "resize-lvm-root", dest: "/usr/local/bin/resize-lvm-root", mode: "0755" }
    - { src: "setup-dns", dest: "/usr/local/bin/setup-dns", mode: "0755" }

- name: Configure streamlined cloud-init configuration
  copy:
    dest: /etc/cloud/cloud.cfg.d/99-core0.cfg
    mode: 0644
    content: |
      datasource_list: [
        NoCloud, ConfigDrive, OpenStack, Azure, GCE, Ec2, VMware,
        OVF, MAAS, CloudStack, Hetzner, Oracle, None
      ]

      ssh_deletekeys: true
      disable_root: true

      ssh_pwauth: false

      # DNS is owned by setup-dns + dnscrypt-proxy, not cloud-init.
      manage_resolv_conf: false

      users:
        - default

      cloud_init_modules:
       - seed_random
       - bootcmd
       - write-files
       - disk_setup
       - mounts
       - set_hostname
       - update_hostname
       - update_etc_hosts
       - users-groups
       - ssh

      cloud_config_modules:
       - set_passwords
       - runcmd

      cloud_final_modules:
       - scripts-user
       - ssh-authkey-fingerprints
       - keys-to-console
       - final-message
       - power-state-change

      system_info:
        distro: opensuse
        ssh_svcname: sshd
        default_user:
          name: core0user
          lock_passwd: true
          gecos: Cloud User
          groups: [users, wheel]
          sudo: ["ALL=(ALL) NOPASSWD:ALL"]
          shell: /bin/bash

      bootcmd:
        - [/usr/local/bin/resize-lvm-root]

      runcmd:
        - systemctl daemon-reload
        - sleep 2
        - /usr/local/bin/setup-dns || true
