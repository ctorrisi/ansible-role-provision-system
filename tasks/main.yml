---
- name: Gather service facts
  service_facts:

# Matches both "openSUSE Tumbleweed" and "openSUSE Tumbleweed-Slowroll", so the
# block still runs once a host has been migrated to Slowroll.
- name: openSUSE rolling-release specific tasks
  include_tasks: opensuse.yml
  when: ansible_distribution is search('openSUSE Tumbleweed')

- name: Install base packages
  include_tasks: packages.yml

- name: Configure cloud-init
  include_tasks: cloud-init.yml

- name: Configure DNS
  include_tasks: dns.yml

- name: Configure networking
  include_tasks: networking.yml

- name: Configure Podman
  include_tasks: podman.yml

- name: Configure system tuning
  include_tasks: system-tuning.yml
