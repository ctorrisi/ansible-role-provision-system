---
- name: Install base system packages
  package:
    name:
      # Core system packages
      - cloud-init
      - growpart
      - python3-rpm

      # Container and DNS services
      - podman
      - dnscrypt-proxy
      - dnsmasq

      # Essential utilities for scripts
      - unzip
      - curl
      - jq
      - wget
      - ca-certificates
    state: present

- name: Select hypervisor guest tools
  set_fact:
    guest_tools_selected: >-
      {{ guest_tools_platforms | map('extract', guest_tools_packages)
         | flatten | unique | list }}

- name: Report guest tools selection
  debug:
    msg: >-
      Guest tools for {{ guest_tools_platforms | join(', ') }}:
      {{ guest_tools_selected | join(', ') | default('none', true) }}

- name: Install virtualization guest tools and drivers
  package:
    name: "{{ guest_tools_selected }}"
    state: present
  when: guest_tools_selected | length > 0

- name: Reload systemd
  systemd:
    daemon_reload: yes
