---
- name: Configure NetworkManager to not manage DNS
  copy:
    dest: /etc/NetworkManager/NetworkManager.conf
    mode: 0644
    content: |
      [main]
      dns=none
      rc-manager=unmanaged

      [ipv4]
      dns=127.0.0.1

- name: Restart NetworkManager
  service:
    name: NetworkManager
    state: restarted

- name: Configure netfilter connection tracking parameters
  copy:
    dest: /etc/modprobe.d/99-nf_conntrack.conf
    content: |
      options nf_conntrack hashsize=250000
    owner: root
    group: root
    mode: 0644

# nf_conntrack is autoloaded on demand by the nftables `ct` rules, but that
# happens *after* systemd-sysctl runs. The net.netfilter.nf_conntrack_* keys in
# 99-sysctl.conf do not exist until the module is loaded, so without this they
# are silently dropped. systemd-sysctl.service orders itself After=
# systemd-modules-load.service, which makes this the fix.
#
# nf_conntrack_ipv4/_ipv6 are deliberately absent: they were folded into
# nf_conntrack in kernel 4.19 and no longer exist, so listing them only makes
# systemd-modules-load.service log failures on every boot.
- name: Configure netfilter modules to load at boot
  copy:
    dest: /etc/modules-load.d/nf_conntrack.conf
    content: |
      nf_conntrack
    owner: root
    group: root
    mode: 0644

- name: Enable and restart systemd-modules-load service
  systemd:
    name: systemd-modules-load
    state: restarted
    enabled: yes
    daemon_reload: yes
